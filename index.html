<style>

    width: 100%; height: 100%;

    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    /* los píxeles se escalan enteros: sin esto el navegador los difumina */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #sonido {
    position: fixed; right: 10px; top: 10px;
    width: 40px; height: 40px;
    border: 0; border-radius: 8px;
    background: rgba(0,0,0,0.25);
    color: #fff; font-size: 20px;
    cursor: pointer;

<script>
'use strict';

// ============================================================
//  Tiempo: la página puede arrancar en una fecha forzada con
//  ?fecha=2027-01-05T15:00 para ver la fiesta o la noche sin esperar.
//  Desde ese instante el reloj avanza normal.
// ============================================================
const PARAMS = new URLSearchParams(location.search);
const FECHA_FORZADA = PARAMS.get('fecha') ? new Date(PARAMS.get('fecha')) : null;
const ACTIVIDAD_FORZADA = PARAMS.get('actividad');
const T0 = performance.now();

function ahora() {
  if (FECHA_FORZADA && !isNaN(FECHA_FORZADA)) {
    return new Date(FECHA_FORZADA.getTime() + (performance.now() - T0));
  }
  return new Date();
}

// ============================================================
//  Lienzo: escala entera para que los píxeles queden nítidos, y el
//  ancho/alto lógico se adaptan al teléfono para no dejar franjas.
// ============================================================
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
let W = 180, H = 320, ESCALA = 2;

function ajustarLienzo() {
  const vw = window.innerWidth, vh = window.innerHeight;
  ESCALA = Math.max(1, Math.min(Math.floor(vw / 180), Math.floor(vh / 300)));
  W = Math.min(260, Math.floor(vw / ESCALA));
  H = Math.min(420, Math.floor(vh / ESCALA));
  canvas.width = W; canvas.height = H;
  canvas.style.width = (W * ESCALA) + 'px';
  canvas.style.height = (H * ESCALA) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', ajustarLienzo);
ajustarLienzo();

// ============================================================
//  Cielo por hora: paradas de color interpoladas en RGB.
//  [hora, cielo arriba, cielo abajo, suelo, texto, factor de noche]
// ============================================================
const CIELO = [
  [0,    '#0a0d2e', '#1c1f4f', '#1e3a2a', '#f2ecff', 1.0],
  [5,    '#0a0d2e', '#1c1f4f', '#1e3a2a', '#f2ecff', 1.0],
  [6.5,  '#5a3f8c', '#f4a072', '#3a6a3a', '#fff4e0', 0.45],
  [8,    '#5cb0f0', '#b8e4fa', '#5aa84a', '#1f2a4a', 0.0],
  [12,   '#3f9be8', '#b8e4fa', '#62b84e', '#1f2a4a', 0.0],
  [17,   '#4f9fe0', '#ffd8a0', '#5aa84a', '#1f2a4a', 0.0],
  [18.8, '#6f3f8f', '#ff8f52', '#3f6f3a', '#fff4e0', 0.35],
  [20,   '#121542', '#2a2c66', '#1e3a2a', '#f2ecff', 0.85],
  [24,   '#0a0d2e', '#1c1f4f', '#1e3a2a', '#f2ecff', 1.0],
];

function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mezcla(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
}

function colorCielo(hora) {
  let i = 0;
  while (i < CIELO.length - 2 && hora >= CIELO[i + 1][0]) i++;
  const a = CIELO[i], b = CIELO[i + 1];
  const t = Math.min(1, Math.max(0, (hora - a[0]) / (b[0] - a[0])));
  return {
    arriba: mezcla(a[1], b[1], t),
    abajo: mezcla(a[2], b[2], t),
    suelo: mezcla(a[3], b[3], t),
    texto: mezcla(a[4], b[4], t),
    noche: a[5] + (b[5] - a[5]) * t,
  };
}

  '♥': ['.#.#.','#####','#####','.###.','..#..'],
  '♪': ['..##','..#.','..#.','###.','.##.'],
};
const ACCENTS = { 'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U' };

function glyphRows(ch) {
  if (FONT[ch]) return { rows: FONT[ch], top: 0 };
  if (ACCENTS[ch]) return { rows: FONT[ACCENTS[ch]], top: 1 };
  if (ch === 'Ñ') return { rows: FONT['N'], top: 2 };
  return { rows: FONT[' '], top: 0 };
}

function textWidth(str, px) {
  let w = 0;
  for (const ch of str) w += glyphRows(ch).rows[0].length + 1;
  return (w - 1) * px;
}

// color puede ser un string o una función (índice de letra) → color,
// para el letrero arcoíris de la fiesta
function drawText(str, x, y, px, color, align = 'left') {
  const tw = textWidth(str, px);
  let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
  cx = Math.round(cx);
  y = Math.round(y);
  let i = 0;
  for (const ch of str) {
    ctx.fillStyle = typeof color === 'function' ? color(i) : color;
    const { rows, top } = glyphRows(ch);
    const gw = rows[0].length;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < gw; c++) {
        if (rows[r][c] === '#') ctx.fillRect(cx + c * px, y + r * px, px, px);
      }
    }
    if (top === 1) {
      const a = Math.floor(gw / 2);
      ctx.fillRect(cx + (a + 1) * px, y - 3 * px, px, px);
      ctx.fillRect(cx + a * px, y - 2 * px, px, px);
    } else if (top === 2) {
      ctx.fillRect(cx + 1 * px, y - 2 * px, 2 * px, px);
      ctx.fillRect(cx + 3 * px, y - 3 * px, 2 * px, px);
    }
    cx += (gw + 1) * px;
    i++;
  }
}

// Texto con sombra de 1 px: sin ella el amarillo del atardecer se come
// las letras claras y el azul del mediodía las oscuras.
function textoSombra(str, x, y, px, color, sombra, align = 'center') {
  drawText(str, x + 1, y + 1, px, sombra, align);
  drawText(str, x, y, px, color, align);
}

// ============================================================
//  Sprites: matrices de caracteres → canvas. '.' es transparente.
// ============================================================
const SPRITE_SCALE = 3;
const S = SPRITE_SCALE;   // atajo para posiciones en unidades de cuadrícula

function makeSprite(rows, colors, scale) {
  const h = rows.length, w = rows[0].length, s = scale || SPRITE_SCALE;
  const c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error('fila de sprite con ancho distinto: ' + rows[y]);
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const col = colors[ch];
      if (!col) throw new Error('color sin definir en sprite: ' + ch);
      g.fillStyle = col;
      g.fillRect(x * s, y * s, s, s);
    }
  }
  return c;
}

function espejo(rows) { return rows.map(r => r.split('').reverse().join('')); }

// Beba lleva el pelo a la barbilla: a cada expresión se le alarga la
// melena dos filas (las cabezas base son de pelo corto, para invitados).
function melena(rows) {
  const r = rows.slice();
  r[9]  = '..H' + r[9].slice(3, 13) + 'H..';
  r[10] = '..HH' + r[10].slice(4, 12) + 'HH..';
  return r;
}

// Se rasterizan una vez por (paleta, parte): dibujar es solo drawImage

  SPR[np] = { cabeza: {}, cuerpo: {} };
  const cabezas = np === 'beba' ? CABEZAS_BEBA : CABEZAS;
  for (const [nc, rows] of Object.entries(cabezas)) SPR[np].cabeza[nc] = makeSprite(rows, pal);
  for (const [nc, rows] of Object.entries(CUERPOS)) SPR[np].cuerpo[nc] = makeSprite(rows, pal);
}

const ANCHO_PERSONAJE = 16 * SPRITE_SCALE;

// (x, y) = centro de los pies sobre el suelo. dyCabeza mueve solo la cabeza
// (cabeceo al leer, al comer) sin despegar los pies.
function dibujarPersonaje(paleta, cabeza, cuerpo, x, y, dx = 0, dy = 0, dyCabeza = 0, gorro = null) {
  const s = SPR[paleta];
  const x0 = Math.round(x - ANCHO_PERSONAJE / 2 + dx);
  const y0 = Math.round(y - ALTO_PERSONAJE + dy);
  const yCuerpo = y0 + (CABEZA_ALTO - CUERPO_SOLAPE) * SPRITE_SCALE;
  ctx.drawImage(s.cuerpo[cuerpo], x0, yCuerpo);
  ctx.drawImage(s.cabeza[cabeza], x0, y0 + dyCabeza);
  if (gorro) ctx.drawImage(gorro, x0 + 4 * SPRITE_SCALE, y0 + dyCabeza - gorro.height + 3 * SPRITE_SCALE);
}

// Dibuja un sprite con su esquina inferior izquierda en (x, y): los props
// se apoyan en el suelo, así que es la referencia natural.
function apoyar(spr, x, y) { ctx.drawImage(spr, Math.round(x), Math.round(y - spr.height)); }

// Cabeza acostada: la misma cabeza con ojos cerrados girada 90° (la
// coronilla hacia la almohada). Un giro exacto no difumina píxeles.
function rotarIzq(spr) {
  const c = document.createElement('canvas');
  c.width = spr.height; c.height = spr.width;
  const g = c.getContext('2d');
  g.translate(0, c.height);
  g.rotate(-Math.PI / 2);
  g.drawImage(spr, 0, 0);
  return c;
}
const CABEZA_DORMIDA = rotarIzq(SPR.beba.cabeza.cerrados);

// ============================================================
//  Partículas decorativas reutilizables (notas, vapor, gotas)
// ============================================================
// n copias que suben en ciclo desfasado y se desvanecen al final
function subirCiclico(spr, n, x, y, t, periodoMs, alto, separacion) {
  for (let i = 0; i < n; i++) {
    const f = ((t / periodoMs) + i / n) % 1;
    ctx.globalAlpha = 1 - f;
    ctx.drawImage(spr, Math.round(x + i * separacion + Math.sin(f * 6 + i) * 2), Math.round(y - f * alto));
  }
  ctx.globalAlpha = 1;
}

// Banquito bajo la sentada: tabla y dos patas (medidas en cuadrícula)
function banquito(x, y) {
  ctx.fillStyle = PC.m; ctx.fillRect(x, y - 3 * S, 8 * S, 1.5 * S);
  ctx.fillStyle = PC.d; ctx.fillRect(x + 0.5 * S, y - 1.5 * S, S, 1.5 * S); ctx.fillRect(x + 6.5 * S, y - 1.5 * S, S, 1.5 * S);
}

function actividadActual(fecha) {
  if (ACTIVIDAD_FORZADA) {
    if (ACTIVIDAD_FORZADA === 'dormir') return DORMIR;
    const a = ACTIVIDADES.find(a => a.id === ACTIVIDAD_FORZADA);

const FIESTA = { confeti: [], globos: [], lista: false };

function azarEntre(a, b) { return a + Math.random() * (b - a); }

function prepararFiesta() {
  FIESTA.confeti = [];
  for (let i = 0; i < 60; i++) {
    FIESTA.confeti.push({ x: azarEntre(0, W), y: azarEntre(-H * 0.3, H), v: azarEntre(14, 30), f: azarEntre(0, 6.28),
      col: CONFETI_COLORES[i % CONFETI_COLORES.length] });
  }
  FIESTA.globos = [];
  for (let i = 0; i < 6; i++) {
    FIESTA.globos.push({ x: azarEntre(6, W - 20), y: azarEntre(0, H), v: azarEntre(6, 12), f: azarEntre(0, 6.28), spr: GLOBOS[i % GLOBOS.length] });
  }
  FIESTA.lista = true;
}

function dibujarFiesta(t, dt, gy) {
  if (!FIESTA.lista) prepararFiesta();
  const cx = W / 2;

  for (let fila = 0; fila < 2; fila++) {
    const yHilo = 52 + fila * 40 + gy * 0.12;
    const paso = 12, ancho = 8, alto = 6;
    ctx.fillStyle = '#f4f0e8';
    for (let x = 0; x < W; x++) {
      const comba = Math.sin((x / W) * Math.PI) * 10;
      ctx.fillRect(x, Math.round(yHilo + comba), 1, 1);
    }
    for (let i = 0, x = 2 + fila * 6; x < W; x += paso, i++) {
      const comba = Math.sin(((x + ancho / 2) / W) * Math.PI) * 10;
      const y = Math.round(yHilo + comba) + 1;
      ctx.fillStyle = CONFETI_COLORES[(i + fila * 3) % (CONFETI_COLORES.length - 1)];
      ctx.fillRect(x, y, ancho, alto);
      // la muesca del papel picado
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x + 3, y + 2, 2, 2);
      ctx.fillRect(x + 1, y + alto - 1, 2, 1); ctx.fillRect(x + 5, y + alto - 1, 2, 1);
    }
  }

  // globos al fondo, subiendo despacio y bamboleando
  for (const g of FIESTA.globos) {
    g.y -= g.v * dt;
    if (g.y < -30) { g.y = H + 10; g.x = azarEntre(6, W - 20); }
    ctx.drawImage(g.spr, Math.round(g.x + Math.sin(t / 900 + g.f) * 3), Math.round(g.y));
  }

  for (let i = 0; i < INVITADOS.length; i++) {
    const inv = INVITADOS[i];
    const paso = PASOS_BAILE[Math.floor(t / 260 + i) % PASOS_BAILE.length];
    dibujarPersonaje(inv.paleta, inv.cabeza, paso[0], cx + inv.dx * S, gy, 0, paso[1] * S, 0, GORROS[inv.gorro]);
  }
  const pasoBeba = PASOS_BAILE[Math.floor(t / 260) % PASOS_BAILE.length];
  dibujarPersonaje('beba', 'feliz', pasoBeba[0], cx, gy, 0, pasoBeba[1] * S, 0, GORROS[0]);

  // pastel al frente sobre una mesita (un poco abajo del suelo, en primer
  // plano), velas con flama que titila
  const yMesa = gy + 4 * S;
  ctx.fillStyle = PC.m; ctx.fillRect(cx - 14 * S, yMesa, 28 * S, 2 * S);
  ctx.fillStyle = PC.d; ctx.fillRect(cx - 13 * S, yMesa + 2 * S, 1.5 * S, 3 * S); ctx.fillRect(cx + 11.5 * S, yMesa + 2 * S, 1.5 * S, 3 * S);
  apoyar(PROPS.pastel, cx - 12 * S, yMesa);
  const flama = PROPS.flama[Math.floor(t / 120) % 3];
  for (const vx of [5, 12, 19]) ctx.drawImage(flama, cx - 12 * S + vx * S - S, yMesa - PROPS.pastel.height - 2 * S);

  // confeti al frente de todo
  for (const c of FIESTA.confeti) {
    c.y += c.v * dt;
    c.x += Math.sin(t / 500 + c.f) * 12 * dt;
    if (c.y > H) { c.y = -4; c.x = azarEntre(0, W); }
    ctx.fillStyle = c.col;
    const giro = Math.floor(t / 150 + c.f) % 2;
    ctx.fillRect(Math.round(c.x), Math.round(c.y), giro ? 3 : 2, giro ? 1 : 3);
  }
}

// ============================================================
//  Cielo, sol/luna, estrellas, nubes, colinas y suelo
// ============================================================
function aRgb(c) {
  if (c[0] === '#') return hexRgb(c);
  return c.slice(4, -1).split(',').map(Number);
}
function mezclaRgb(a, b, t) {
  const A = aRgb(a), B = aRgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
}

// Estrellas en posiciones fijas (fracciones del cielo) con brillo desfasado
const ESTRELLAS = [];
{
  let sem = 7;
  const r = () => { sem = (sem * 1103515245 + 12345) % 2147483648; return sem / 2147483648; };
  for (let i = 0; i < 45; i++) ESTRELLAS.push({ fx: r(), fy: r() * 0.85, f: r() * 6.28, g: r() > 0.7 });
}

function dibujarCielo(c, hora, t, gy) {
  const bandas = 12;
  for (let i = 0; i < bandas; i++) {
    ctx.fillStyle = mezclaRgb(c.arriba, c.abajo, i / (bandas - 1));
    const y0 = Math.floor(gy * i / bandas), y1 = Math.floor(gy * (i + 1) / bandas);
    ctx.fillRect(0, y0, W, y1 - y0);
  }

  if (c.noche > 0.05) {
    for (const e of ESTRELLAS) {
      const brillo = 0.55 + 0.45 * Math.sin(t / 700 + e.f);
      ctx.globalAlpha = c.noche * brillo;
      ctx.fillStyle = '#ffffff';
      const x = Math.round(e.fx * W), y = Math.round(e.fy * gy);
      ctx.fillRect(x, y, 1, 1);
      if (e.g) { ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1); }
    }
    ctx.globalAlpha = 1;
  }

  // sol de 6 a 20 y luna de 20 a 6, ambos en un arco sobre el horizonte
  const arco = (f, spr) => {
    const a = f * Math.PI;
    const x = W / 2 - Math.cos(a) * (W / 2 - 14) - spr.width / 2;
    const y = gy - 6 - Math.sin(a) * (gy - 100) - spr.height / 2;
    ctx.drawImage(spr, Math.round(x), Math.round(y));
  };
  if (hora >= 6 && hora <= 20) arco((hora - 6) / 14, PROPS.sol);
  else arco(((hora >= 20 ? hora - 20 : hora + 4) / 10), PROPS.luna);

  if (c.noche < 0.95) {
    ctx.globalAlpha = 1 - c.noche;
    for (let i = 0; i < 3; i++) {
      const x = ((t / 1000) * (3 + i) + i * 97) % (W + 40) - 24;
      ctx.drawImage(PROPS.nube, Math.round(x), 70 + i * 34);
    }
    // parvada de 3 que cruza cada tanto (de noche no hay)
    if (c.noche < 0.5) {
      const spr = PROPS.pajaro[Math.floor(t / 180) % 2];
      const base = ((t / 1000) * 22) % (W + 260) - 60;
      for (let i = 0; i < 3; i++) {
        ctx.drawImage(spr, Math.round(base - i * 14), Math.round(gy * 0.42 + i * 8 + Math.sin(t / 400 + i) * 2));
      }
    }
    ctx.globalAlpha = 1;
  }

  // colinas: dos capas de lomas, la de atrás más clara
  const colina = (col, base, alto, ancho, desf) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, base);
    for (let x = 0; x <= W; x++) {
      const y = base - alto * (0.6 + 0.4 * Math.sin((x + desf) / ancho)) * (0.7 + 0.3 * Math.sin((x + desf * 2) / (ancho * 0.37)));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, base); ctx.closePath(); ctx.fill();
  };
  colina(mezclaRgb(c.suelo, c.abajo, 0.45), gy, 26, 30, 10);
  colina(mezclaRgb(c.suelo, '#000000', 0.15), gy, 14, 22, 70);

  ctx.fillStyle = c.suelo;
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = mezclaRgb(c.suelo, '#000000', 0.25);
  ctx.fillRect(0, gy, W, 2);
}

// ============================================================
//  Audio chiptune (portado de Hop Invaders). Se crea con el primer
//  toque porque el navegador no deja sonar nada antes.
// ============================================================
const SND = {
  ac: null, out: null,
  muted: true,
  ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ac) {
      this.ac = new AC();
      this.out = this.ac.createGain();
      this.out.gain.value = 0.22;
      this.out.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    // iOS solo destraba el audio si algo suena dentro del gesto: un
    // buffer vacío basta y no se oye
    if (!this.destrabado) {
      const src = this.ac.createBufferSource();
      src.buffer = this.ac.createBuffer(1, 1, 22050);
      src.connect(this.ac.destination);
      src.start(0);
      this.destrabado = true;
    }
  },
  tone(f0, f1, dur, type, vol, delay) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, delay, cutoff) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime + (delay || 0);
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource();
    src.buffer = buf;
    const f = this.ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cutoff || 800;
    const g = this.ac.createGain();
    g.gain.value = vol || 0.6;
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t);
  },
};

// Notas: G4 392, A4 440, B4 494, C5 523, D5 587, E5 659, F5 698, G5 784.
// Pasos = corcheas; Las Mañanitas va en 3/4, seis corcheas por compás.
const TRACKS = {
  fiesta: {
    bpm: 100, bassType: 'triangle', bassVol: 0.30, leadType: 'square', leadVol: 0.14,
    // "Estas son las mañanitas / que cantaba el rey David / hoy por ser
    //  día de tu santo / te las cantamos a ti"
    lead: [392, 392, 440, 0, 392, 0,   523, 0, 494, 0, 0, 0,
           392, 392, 440, 0, 392, 0,   587, 0, 523, 0, 0, 0,
           392, 392, 784, 0, 659, 0,   523, 0, 494, 0, 440, 0,
           698, 698, 659, 0, 523, 0,   587, 0, 523, 0, 0, 0],
    bass: [130.8, 0, 196, 0, 196, 0,   98, 0, 147, 0, 147, 0,
           130.8, 0, 196, 0, 196, 0,   98, 0, 147, 0, 147, 0,
           130.8, 0, 196, 0, 196, 0,   98, 0, 147, 0, 147, 0,
           87.3, 0, 131, 0, 131, 0,    98, 0, 130.8, 0, 130.8, 0],
    noise: [1, 0, 0, 0, 0, 0],
  },
  // tonada suave de día, en triángulo para que no canse
  dia: {
    bpm: 112, bassType: 'triangle', bassVol: 0.22, leadType: 'triangle', leadVol: 0.16,
    lead: [523, 0, 659, 0, 784, 0, 659, 0,  587, 0, 698, 0, 659, 0, 0, 0,
           523, 0, 659, 0, 784, 0, 880, 0,  784, 0, 659, 0, 587, 0, 0, 0],
    bass: [130.8, 0, 0, 0, 196, 0, 0, 0,  174.6, 0, 0, 0, 196, 0, 0, 0,
           130.8, 0, 0, 0, 196, 0, 0, 0,  146.8, 0, 0, 0, 196, 0, 0, 0],
    noise: [0],
  },
  // canción de cuna, lenta
  noche: {
    bpm: 72, bassType: 'triangle', bassVol: 0.18, leadType: 'triangle', leadVol: 0.14,
    lead: [392, 0, 0, 0, 330, 0, 0, 0,  392, 0, 0, 0, 330, 0, 0, 0,
           440, 0, 0, 0, 392, 0, 0, 0,  330, 0, 0, 0, 0, 0, 0, 0],
    bass: [130.8, 0, 0, 0, 0, 0, 0, 0,  98, 0, 0, 0, 0, 0, 0, 0,
           110, 0, 0, 0, 0, 0, 0, 0,  98, 0, 0, 0, 0, 0, 0, 0],
    noise: [0],
  },
};

const MUSIC = {
  track: null, step: 0, nextT: 0,
  set(name) {
    if (this.track !== name) { this.track = name; this.step = 0; this.nextT = 0; }
  },
  tick() {
    if (!SND.ac || SND.muted || !this.track) return;
    const now = SND.ac.currentTime;
    if (this.nextT < now - 0.2) this.nextT = now + 0.05;   // resincroniza tras pausas
    const def = TRACKS[this.track];
    const stepDur = 60 / def.bpm / 2;
    while (this.nextT < now + 0.2) {
      const d = this.nextT - now;
      const b = def.bass[this.step % def.bass.length];
      if (b) SND.tone(b, b, stepDur * 0.9, def.bassType, def.bassVol, d);
      const l = def.lead[this.step % def.lead.length];
      if (l) SND.tone(l, l, stepDur * 0.6, def.leadType, def.leadVol, d);
      if (def.noise[this.step % def.noise.length]) SND.noise(0.04, 0.14, d, 3200);
      this.step++;
      this.nextT += stepDur;
    }
  },
};

const botonSonido = document.getElementById('sonido');
function pintarBoton() { botonSonido.textContent = SND.muted ? '🔇' : '🔊'; }
botonSonido.addEventListener('click', () => {
  SND.ensure();
  SND.muted = !SND.muted;
  try { localStorage.setItem('beba_sonido', SND.muted ? '0' : '1'); } catch (e) {}
  pintarBoton();
});
// Si la última vez dejó el sonido encendido, con el primer toque en
// cualquier parte vuelve a sonar (el botón no es obligatorio). Se escucha
// click y touchend, no pointerdown: en el celular pointerdown no cuenta
// como gesto para el AudioContext y el icono cambiaba sin que sonara.
let quiereSonido = false;
try { quiereSonido = localStorage.getItem('beba_sonido') === '1'; } catch (e) {}
function reanudar(e) {
  if (e.target === botonSonido) return;   // el botón ya lo hace en su click
  if (quiereSonido && SND.muted) { SND.ensure(); SND.muted = false; pintarBoton(); }
  // si el contexto quedó suspendido (pestaña en segundo plano, bloqueo
  // de pantalla), cualquier toque lo vuelve a levantar
  else if (!SND.muted && SND.ac && SND.ac.state === 'suspended') SND.ac.resume();
}
window.addEventListener('click', reanudar);
window.addEventListener('touchend', reanudar);
pintarBoton();

// ============================================================
//  Textos: cuenta regresiva arriba, actividad y fecha abajo
// ============================================================
const ARCOIRIS = ['#ff5a5a', '#ffb347', '#ffe74a', '#5ae07a', '#4ac0ff', '#b07aff', '#ff7ad0'];
const dos = n => (n < 10 ? '0' : '') + n;

function dibujarTextos(r, c, fecha, t, actividad) {
  const cx = W / 2;
  const sombra = c.noche > 0.5 ? '#000000' : 'rgba(0,0,0,0.35)';
  if (r.esFiesta) {
    const arco = i => ARCOIRIS[(i + Math.floor(t / 150)) % ARCOIRIS.length];
    textoSombra('¡FELIZ', cx, 10, 2, c.texto, sombra);
    textoSombra('CUMPLEAÑOS', cx, 26, 2, c.texto, sombra);
    textoSombra('BEBA!', cx, 44, 3, arco, sombra);
  } else if (r.dias > 0) {
    textoSombra('FALTAN', cx, 10, 2, c.texto, sombra);
    textoSombra(r.dias + (r.dias === 1 ? ' DÍA' : ' DÍAS'), cx, 26, 3, c.texto, sombra);
    textoSombra(dos(r.horas) + ':' + dos(r.min) + ':' + dos(r.seg), cx, 48, 2, c.texto, sombra);
  } else {
    textoSombra('YA CASI', cx, 10, 2, c.texto, sombra);
    textoSombra(dos(r.horas) + ':' + dos(r.min) + ':' + dos(r.seg), cx, 26, 3, c.texto, sombra);
    textoSombra('¡MAÑANA ES EL DÍA!', cx, 48, 1, c.texto, sombra);
  }

  const claro = '#ffffff', som = 'rgba(0,0,0,0.45)';
  textoSombra(r.esFiesta ? '¡HOY ES EL GRAN DÍA!' : actividad.texto, cx, H - 46, 1, claro, som);
}

// ============================================================
//  Loop principal
// ============================================================
let tAnterior = performance.now();
let fondoCuerpo = '';

function cuadro(tAhora) {
  const dt = Math.min(0.1, (tAhora - tAnterior) / 1000);
  tAnterior = tAhora;

  const fecha = ahora();
  const r = Fechas.restante(fecha);
  const hora = Fechas.horaDecimal(fecha);
  const c = colorCielo(hora);
  const GY = H - 92;
  const actividad = actividadActual(fecha);

  dibujarCielo(c, hora, tAhora, GY);

  if (r.esFiesta) {
    dibujarFiesta(tAhora, dt, GY);
  } else {
    const cx = W / 2;
    const k = Math.floor(tAhora / actividad.dur);
    if (actividad.especial) {
      actividad.especial(k, tAhora, cx, GY);
    } else {
      const q = actividad.cuadros[k % actividad.cuadros.length];
      actividad.fondo(k, tAhora, cx, GY);
      dibujarPersonaje('beba', q[0], q[1], cx, GY, q[2] * S, q[3] * S, q[4] * S);
      actividad.frente(k, tAhora, cx, GY);
    }
  }

  // De noche todo se atenúa un poco; el texto va encima para que se lea
  if (c.noche > 0) {
    ctx.fillStyle = 'rgba(8,10,50,' + (0.28 * c.noche).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  dibujarTextos(r, c, fecha, tAhora, actividad);

  MUSIC.set(r.esFiesta ? 'fiesta' : (actividad === DORMIR ? 'noche' : 'dia'));
  MUSIC.tick();

  if (fondoCuerpo !== c.abajo) {
    fondoCuerpo = c.abajo;
    document.body.style.background = c.abajo;
    document.querySelector('meta[name=theme-color]').setAttribute('content', c.abajo);
  }

  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
